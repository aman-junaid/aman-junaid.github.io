title: Aman Junaid
description: Aman Junaid — software engineer and independent app developer.
url: "https://www.amanjunaid.com"
baseurl: ""
markdown: kramdown
permalink: pretty
collections:
  guides:
    output: true
    permalink: /apps/met/guides/:name/
  apps:
    output: true
    permalink: /apps/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: guides
    values:
      layout: guide
  - scope:
      path: ""
      type: apps
    values:
      layout: app
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
